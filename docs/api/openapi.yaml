openapi: 3.1.0
info:
  title: Contrato de integração Weatherbit Current
  version: 1.0.0
  description: >-
    Contrato da integração cliente-side do Tambaclima com o endpoint externo
    Weatherbit para condições meteorológicas atuais. Não descreve uma API
    própria do Tambaclima. A resposta e os campos podem variar conforme o
    plano e a localização. Previsão e probabilidade futura de chuva não fazem
    parte deste endpoint.
  contact:
    name: Equipe Tambaclima
servers:
  - url: https://api.weatherbit.io/v2.0
    description: API pública Weatherbit
externalDocs:
  description: Documentação oficial de condições atuais Weatherbit
  url: https://www.weatherbit.io/api/weather-current
paths:
  /current:
    get:
      operationId: getCurrentWeather
      summary: Consultar condições meteorológicas atuais
      description: >-
        Consulta a observação mais recente para uma localidade. Informe city
        e country, ou outra forma de localização aceita pelo provedor. A chave
        da API é uma query parameter exigida pelo provedor; nunca a grave neste
        arquivo ou no repositório.
      security:
        - weatherbitApiKey: []
      parameters:
        - name: city
          in: query
          required: false
          description: Nome da cidade; usado aqui com country=BR.
          schema:
            type: string
            example: Manaus
        - name: country
          in: query
          required: false
          description: Código ISO de duas letras do país.
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: BR
        - name: units
          in: query
          required: false
          description: Sistema de unidades. M corresponde ao sistema métrico.
          schema:
            type: string
            enum: [M, I, S]
            default: M
        - name: lang
          in: query
          required: false
          description: Idioma da descrição textual das condições.
          schema:
            type: string
            default: pt
            example: pt
      responses:
        '200':
          description: Observação atual retornada pelo provedor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentWeatherResponse'
              example:
                count: 1
                data:
                  - city_name: Manaus
                    country_code: BR
                    temp: 30.2
                    app_temp: 34.1
                    rh: 72
                    uv: 8.1
                    wind_spd: 1.4
                    pres: 1008.5
                    precip: 0
                    ob_time: '2026-11-10 12:00'
                    weather:
                      code: 800
                      description: Céu limpo
                      icon: c01d
        '400':
          description: Parâmetros de localização inválidos ou ausentes.
        '401':
          description: Chave da API ausente ou inválida.
        '403':
          description: Acesso não autorizado pelo provedor ou plano contratado.
        '429':
          description: Limite de requisições do provedor excedido.
        '500':
          description: Erro interno no serviço Weatherbit.
        default:
          description: Outra resposta de erro do provedor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderError'
components:
  securitySchemes:
    weatherbitApiKey:
      type: apiKey
      in: query
      name: key
      description: >-
        Definir como WEATHERBIT_API_KEY no ambiente local ou secret do GitHub.
        Esta chave é enviada ao endpoint externo e não deve ser commitada.
  schemas:
    CurrentWeatherResponse:
      type: object
      required: [count, data]
      properties:
        count:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/CurrentObservation'
    CurrentObservation:
      type: object
      properties:
        city_name:
          type: string
        state_code:
          type: [string, 'null']
        country_code:
          type: string
        temp:
          type: number
          description: Temperatura do ar; unidade depende do parâmetro units.
        app_temp:
          type: number
          description: Sensação térmica; unidade depende do parâmetro units.
        rh:
          type: integer
          minimum: 0
          maximum: 100
          description: Umidade relativa percentual.
        uv:
          type: number
          minimum: 0
          description: Índice UV.
        wind_spd:
          type: number
          minimum: 0
          description: Velocidade do vento; m/s quando units=M.
        pres:
          type: number
          description: Pressão na estação, normalmente em mb.
        precip:
          type: number
          minimum: 0
          description: Precipitação observada, normalmente em mm.
        ob_time:
          type: string
          description: Horário da observação conforme retornado pelo provedor.
        weather:
          $ref: '#/components/schemas/WeatherDescription'
    WeatherDescription:
      type: object
      properties:
        code:
          type: integer
        description:
          type: string
        icon:
          type: string
    ProviderError:
      type: object
      additionalProperties: true
      description: Corpo de erro fornecido pelo serviço externo.
