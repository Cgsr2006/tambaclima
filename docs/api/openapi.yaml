openapi: 3.1.0
info:
  title: Integração meteorológica Tambaclima
  version: 2.0.0
  description: >-
    Contrato dos endpoints Weatherbit usados pela aplicação. No ambiente local
    o navegador consulta o provedor; no deploy Vercel a função /api/weather
    atua como proxy e mantém a chave no servidor. A chave nunca deve ser
    registrada neste arquivo ou no repositório.
  contact:
    name: Equipe Tambaclima
servers:
  - url: https://api.weatherbit.io/v2.0
    description: API Weatherbit consultada localmente e pela função Vercel
paths:
  /current:
    get:
      operationId: getCurrentWeather
      summary: Consultar condições atuais
      security:
        - weatherbitApiKey: []
      parameters:
        - name: city
          in: query
          required: true
          schema: { type: string, example: Manaus }
        - name: country
          in: query
          required: true
          schema: { type: string, example: BR }
        - name: lang
          in: query
          required: false
          schema: { type: string, default: pt }
      responses:
        '200':
          description: Observação meteorológica atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeatherbitResponse' }
        '400': { description: Localidade inválida ou ausente }
        '401': { description: Chave ausente ou inválida }
        '429': { description: Limite de requisições excedido }
        default: { description: Erro retornado pelo provedor }
  /forecast/daily:
    get:
      operationId: getDailyForecast
      summary: Consultar probabilidade diária de precipitação
      description: O cliente usa o primeiro dia da previsão (days=1) para exibir chance de chuva.
      security:
        - weatherbitApiKey: []
      parameters:
        - name: city
          in: query
          required: true
          schema: { type: string, example: Manaus }
        - name: country
          in: query
          required: true
          schema: { type: string, example: BR }
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 1, maximum: 16 }
        - name: lang
          in: query
          required: false
          schema: { type: string, default: pt }
      responses:
        '200':
          description: Previsão diária, incluindo probabilidade de precipitação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForecastResponse' }
        '400': { description: Localidade ou parâmetros inválidos }
        '401': { description: Chave ausente ou inválida }
        '429': { description: Limite de requisições excedido }
        default: { description: Erro retornado pelo provedor }
components:
  securitySchemes:
    weatherbitApiKey:
      type: apiKey
      in: query
      name: key
      description: >-
        No deploy, definida como WEATHERBIT_API_KEY no ambiente da Vercel. No
        desenvolvimento local, fornecida por src/scripts/config.js, que não é
        versionado e é visível ao navegador.
  schemas:
    WeatherbitResponse:
      type: object
      properties:
        count: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/CurrentObservation' }
    CurrentObservation:
      type: object
      properties:
        city_name: { type: string }
        state_code: { type: [string, 'null'] }
        temp: { type: number, description: Temperatura em °C no sistema métrico padrão }
        app_temp: { type: number, description: Sensação térmica em °C }
        rh: { type: number, description: Umidade relativa percentual }
        uv: { type: number, description: Índice UV }
        wind_spd: { type: number, description: Velocidade do vento em m/s }
        pres: { type: number, description: Pressão atmosférica em hPa }
        ts: { type: integer, description: Instante da observação em Unix epoch }
        weather:
          type: object
          properties:
            description: { type: string }
    ForecastResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              pop: { type: number, description: Probabilidade de precipitação percentual }
