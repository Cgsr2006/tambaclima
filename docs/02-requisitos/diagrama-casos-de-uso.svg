<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de casos de uso do Tambaclima</title>
  <desc id="description">O visitante consulta o clima de Manaus, curiosidades da Amazônia, pode consultar o panorama de capitais e recebe dados locais quando ocorre falha da API. A API WeatherBit fornece dados climáticos.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#596579" />
    </marker>
    <marker id="openArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#596579" stroke-width="1.5" />
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #182230; }
      .actor { stroke: #344054; stroke-width: 3; fill: none; stroke-linecap: round; }
      .assoc { stroke: #667085; stroke-width: 2; fill: none; }
      .usecase { fill: #f0fdf4; stroke: #16834b; stroke-width: 2; }
      .name { font-size: 16px; font-weight: 600; }
      .label { font-size: 14px; fill: #475467; }
    </style>
  </defs>
  <rect width="1120" height="640" fill="#ffffff" />
  <text x="560" y="38" text-anchor="middle" font-size="23" font-weight="700">Diagrama de Casos de Uso — Tambaclima</text>

  <rect x="255" y="72" width="650" height="520" rx="12" fill="#fbfcfd" stroke="#344054" stroke-width="2" />
  <text x="580" y="101" text-anchor="middle" font-size="18" font-weight="700">Sistema Tambaclima</text>

  <!-- Actor: Visitante -->
  <circle class="actor" cx="125" cy="245" r="18" />
  <path class="actor" d="M125 263 L125 322 M91 282 L159 282 M125 322 L96 361 M125 322 L154 361" />
  <text class="name" x="125" y="389" text-anchor="middle">Visitante</text>

  <!-- Actor: WeatherBit -->
  <circle class="actor" cx="1000" cy="245" r="18" />
  <path class="actor" d="M1000 263 L1000 322 M966 282 L1034 282 M1000 322 L971 361 M1000 322 L1029 361" />
  <text class="name" x="1000" y="389" text-anchor="middle">API WeatherBit</text>

  <!-- Use cases -->
  <ellipse class="usecase" cx="555" cy="175" rx="190" ry="43" />
  <text class="name" x="555" y="171" text-anchor="middle">UC01 — Visualizar clima</text>
  <text class="label" x="555" y="192" text-anchor="middle">atual de Manaus</text>

  <ellipse class="usecase" cx="555" cy="285" rx="190" ry="43" />
  <text class="name" x="555" y="281" text-anchor="middle">UC02 — Consultar curiosidades</text>
  <text class="label" x="555" y="302" text-anchor="middle">da Amazônia</text>

  <ellipse class="usecase" cx="555" cy="395" rx="190" ry="43" />
  <text class="name" x="555" y="391" text-anchor="middle">UC04 — Consultar panorama</text>
  <text class="label" x="555" y="412" text-anchor="middle">do clima nas capitais (opcional)</text>

  <ellipse class="usecase" cx="555" cy="515" rx="190" ry="43" />
  <text class="name" x="555" y="511" text-anchor="middle">UC03 — Acionar dados locais</text>
  <text class="label" x="555" y="532" text-anchor="middle">quando a API estiver indisponível</text>

  <!-- Actor associations -->
  <path class="assoc" d="M159 276 L365 184" />
  <path class="assoc" d="M159 293 L365 283" />
  <path class="assoc" d="M159 310 L365 385" />
  <path class="assoc" d="M159 326 L365 500" />
  <path class="assoc" d="M966 276 L745 184" />
  <path class="assoc" d="M966 309 L745 385" />

  <!-- UC03 extends UC01 when the external service fails. The connector follows
       the right side of the system boundary and leaves gaps at API associations. -->
  <path d="M745 515 L850 515 L850 370 M850 330 L850 240 M850 215 L850 175 L745 175"
        stroke="#667085" stroke-width="2" stroke-dasharray="8 6" fill="none" marker-end="url(#openArrow)" />
  <rect x="786" y="288" width="100" height="24" rx="4" fill="#fbfcfd" />
  <text class="label" x="836" y="305" text-anchor="middle">«extend»</text>
</svg>
